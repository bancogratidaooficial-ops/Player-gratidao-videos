<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>V86 - Vídeos</title><link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#000;color:#fff;text-align:center;padding:10px;padding-bottom:100px}
.top{display:flex;gap:8px;margin-bottom:12px}.top a{flex:1;text-decoration:none;padding:12px;border-radius:10px;font-weight:bold;background:#222;color:#FFD700;border:2px solid #FFD700}.top a.active{background:#FFD700;color:#000}
.busca{display:flex;gap:8px;margin-bottom:12px}.busca input{flex:1;padding:14px;border-radius:12px;border:2px solid #FFD700;background:#111;color:#fff;font-size:16px}.busca button{background:#FFD700;border:none;padding:0 20px;border-radius:12px;font-weight:bold}
.card{border:2px solid #FFD700;border-radius:20px;padding:12px;background:#111}video,iframe{width:100%;height:320px;background:#000;border-radius:10px;margin:10px 0;border:none}
#nome{color:#FFD700;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#status{color:#aaa;font-size:13px;margin:5px}
.vel{display:flex;gap:6px;justify-content:center;margin:10px 0}.vel button{background:#222;border:2px solid #FFD700;color:#FFD700;padding:8px 12px;border-radius:8px}.vel button.ativo{background:#FFD700;color:#000}
.btns{display:flex;justify-content:center;gap:10px;margin:10px 0}.btns button{background:#FFD700;border:none;width:65px;height:65px;border-radius:50%;font-size:22px}
.lista{text-align:left;background:#1a1a1a;border-radius:10px;padding:5px;max-height:350px;overflow:auto;margin:10px 0}
.item{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #333}.item.active{color:#FFD700;background:#222;border-radius:8px}.item span{flex:1;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.del{background:#ff2a2a;color:#fff;border:none;width:35px;height:35px;border-radius:50%}
.green{background:#00d26a;color:#fff;border:none;padding:16px;border-radius:12px;width:100%;font-weight:bold;margin-top:10px}
.share{display:flex;gap:8px;margin-top:10px}.share button{flex:1;padding:14px;border-radius:12px;font-weight:bold;border:none}
</style>
</head>
<body>
<div class="top"><a href="index.html">🎵 MÚSICAS</a><a href="video.html" class="active">🎬 VÍDEOS</a></div>
<div class="busca"><input type="text" id="q" placeholder="🔍 Buscar filme, música, Leonardo..."><button onclick="buscar()">Buscar</button></div>
<div class="card">
<video id="v" controls playsinline style="display:none"></video><iframe id="yt" allowfullscreen style="display:none"></iframe>
<div id="nome">Nenhum vídeo</div><div id="status"></div><div id="cont" style="color:#aaa">0 vídeos</div>
<div class="vel"><button onclick="setVel(0.5)" id="v05">0.5x</button><button onclick="setVel(1)" id="v1" class="ativo">1x</button><button onclick="setVel(1.5)" id="v15">1.5x</button><button onclick="setVel(2)" id="v2">2x</button></div>
<div class="btns"><button onclick="ant()">⏮</button><button style="width:80px;height:80px" onclick="pp()">▶️</button><button onclick="prox()">⏭</button></div>
<div class="lista" id="lista"></div>
</div>
<button class="green" onclick="document.getElementById('f').click()">➕ Adicionar Vídeos do Celular</button><input type="file" id="f" multiple accept="video/*" style="display:none">
<button class="green" style="background:#111;border:2px solid #FFD700;color:#FFD700" onclick="addLink()">🔗 Adicionar por Link (YouTube / MP4)</button>
<div class="share"><button style="background:#25D366;color:#fff" onclick="compartilhar()">📲 Compartilhar</button><button style="background:#FFD700;color:#000" onclick="convidar()">👥 Convidar</button></div>
<p style="margin:20px"><a href="privacidade.html" style="color:#FFD700">Privacidade</a></p>
<script>
let vids=[], idx=0; const video=document.getElementById('v'), yt=document.getElementById('yt'), nome=document.getElementById('nome'), lista=document.getElementById('lista'), cont=document.getElementById('cont'), status=document.getElementById('status'); let db;
const req=indexedDB.open('V86VideoDB',1); req.onupgradeneeded=e=>e.target.result.createObjectStore('videos',{keyPath:'id',autoIncrement:true});
req.onsuccess=async e=>{ db=e.target.result; await carregarGlobal(); carregarLocal(); };
async function carregarGlobal(){ try{ const r=await fetch('./videos/lista.json?v='+Date.now()); if(r.ok){ const j=await r.json(); j.forEach(m=>{vids.push({id:'g_'+m.arquivo, nome:m.titulo, url:'./videos/'+m.arquivo, tipo:'mp4', global:true});}); } }catch(e){} }
function carregarLocal(){ db.transaction('videos','readonly').objectStore('videos').getAll().onsuccess=e=>{ e.target.result.forEach(r=>{vids.push({id:r.id, nome:r.nome, url:r.url||URL.createObjectURL(r.blob), tipo:r.tipo||'mp4', global:false, blobId:r.id});}); montar(); };}
function montar(){ cont.innerText=vids.length+' vídeos'; if(!vids.length){nome.innerText='Digite na busca acima'; return;} render(); if(!video.src &&!yt.src) carregar(0);}
function render(){ lista.innerHTML=''; vids.forEach((x,i)=>{ const d=document.createElement('div'); d.className='item'+(i==idx?' active':''); const s=document.createElement('span'); s.innerText=(i+1)+'. '+x.nome+(x.tipo=='yt'?' ▶️':''); s.onclick=()=>{carregar(i);}; const b=document.createElement('button'); b.className='del'; b.innerText='🗑️'; b.onclick=()=>{ const tx=db.transaction('videos','readwrite'); tx.objectStore('videos').delete(x.blobId); tx.oncomplete=()=>location.reload(); }; d.appendChild(s); d.appendChild(b); lista.appendChild(d); });}
function carregar(i){ idx=i; const m=vids[i]; nome.innerText=m.nome; if(m.tipo=='yt'){ video.style.display='none'; yt.style.display='block'; yt.src=m.url; try{video.pause();}catch(e){} } else { yt.style.display='none'; yt.src=''; video.style.display='block'; video.src=m.url; } render();}
function pp(){ if(vids[idx]?.tipo=='yt'){ status.innerText='Use o play no YouTube'; } else { video.paused?video.play():video.pause(); }} function prox(){ if(vids.length){carregar((idx+1)%vids.length); if(vids[idx].tipo!='yt') video.play();}} function ant(){ if(vids.length){carregar((idx-1+vids.length)%vids.length); if(vids[idx].tipo!='yt') video.play();}}
function setVel(x){ if(vids[idx]?.tipo=='yt'){alert('Velocidade só para vídeos do celular'); return;} video.playbackRate=x; document.querySelectorAll('.vel button').forEach(b=>b.classList.remove('ativo')); document.getElementById('v'+String(x).replace('.','')).classList.add('ativo'); }
function getYtId(url){ const m=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([^&?/]+)/); return m?m[1]:null; }
function addLink(){
 const link=prompt('Cole link YouTube ou MP4:'); if(!link) return; const titulo=prompt('Nome:')||'Vídeo';
 let tipo='mp4', url=link; const id=getYtId(link); if(id){ tipo='yt'; url='https://www.youtube.com/embed/'+id; }
 const tx=db.transaction('videos','readwrite'); tx.objectStore('videos').add({nome:titulo, url:url, tipo:tipo, blob:new Blob([])}); tx.oncomplete=()=>location.reload();
}
async function buscar(){
 const q=document.getElementById('q').value.trim(); if(!q) return; status.innerText='🔍 Buscando '+q+'...'; nome.innerText='Buscando...';
 try{
   // Usa API pública Invidious (sem chave) - 3 servidores de fallback
   let res=null, data=null;
   const servers=['https://inv.tux.pizza/api/v1/search?q=','https://yewtu.be/api/v1/search?q=','https://vid.puffyan.us/api/v1/search?q='];
   for(const srv of servers){
     try{ const r=await fetch(srv+encodeURIComponent(q)); if(r.ok){ data=await r.json(); if(data && data.length){ res=data; break; } } }catch(e){}
   }
   if(!res ||!res.length) throw new Error('sem resultado');
   // pega só vídeos
   const videos=res.filter(v=>v.type=='video').slice(0,10);
   if(!videos.length) throw new Error('sem video');
   // limpa busca antiga duplicada? não, só adiciona
   for(let i=videos.length-1;i>=0;i--){
     const v=videos[i];
     const url='https://www.youtube.com/embed/'+v.videoId;
     vids.unshift({id:Date.now()+i, nome:v.title, url:url, tipo:'yt', global:false, blobId:null});
     const tx=db.transaction('videos','readwrite'); tx.objectStore('videos').add({nome:v.title, url:url, tipo:'yt', blob:new Blob([])});
   }
   status.innerText='✅ '+videos.length+' resultados para "'+q+'"';
   montar(); carregar(0);
 }catch(e){
   status.innerText='❌ Falha na busca, tentando YouTube direto...';
   // fallback: abre YouTube no iframe com o primeiro resultado via embed nocookie com pesquisa via invidious ainda
   const url='https://www.youtube.com/embed?listType=search&list='+encodeURIComponent(q);
   // Se der erro de novo, mostra mensagem amigável
   setTimeout(()=>{ status.innerText='Se der "não disponível", clique no título da lista que abre no YouTube'; },2000);
   vids.unshift({id:Date.now(), nome:'Busca: '+q+' (toque para abrir no YouTube)', url:'https://www.youtube.com/results?search_query='+encodeURIComponent(q), tipo:'yt', global:false});
   montar(); carregar(0);
 }
}
function compartilhar(){ const l=location.href; if(navigator.share){navigator.share({title:'V86 PLAY',url:l});} else {navigator.clipboard.writeText(l); alert('Copiado: '+l);} }
function convidar(){ window.open('https://wa.me/?text='+encodeURIComponent('🎬 Vê no V86 PLAY 👉 '+location.href),'_blank'); }
document.getElementById('f').addEventListener('change', async e=>{ for(const file of e.target.files){ await new Promise(r=>{ const tx=db.transaction('videos','readwrite'); tx.objectStore('videos').add({nome:file.name,blob:file, tipo:'mp4', url:''}); tx.oncomplete=r; }); } location.reload(); });
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
