<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V86 PLAY - Músicas</title>
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#000;color:#fff;text-align:center;padding:10px;padding-bottom:100px}
.top{display:flex;gap:8px;margin-bottom:12px}.top a{flex:1;text-decoration:none;padding:12px;border-radius:10px;font-weight:bold;background:#222;color:#FFD700;border:2px solid #FFD700}.top a.active{background:#FFD700;color:#000}
.card{border:2px solid #FFD700;border-radius:20px;padding:15px;background:#111;margin-bottom:15px}
audio{width:100%;margin:10px 0}#nome{color:#FFD700;font-weight:bold;margin:8px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btns{display:flex;justify-content:center;gap:10px;margin:15px 0}.btns button{background:#FFD700;border:none;width:60px;height:60px;border-radius:50%;font-size:20px}.btns button.peq{width:45px;height:45px;background:#222;border:2px solid #FFD700}
.lista{text-align:left;background:#1a1a1a;border-radius:12px;padding:5px;max-height:350px;overflow:auto;margin:12px 0}
.item{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #333}.item.active{background:#222;color:#FFD700;border-radius:8px}.item span{flex:1;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.del{background:#ff2a2a;color:#fff;border:none;width:36px;height:36px;border-radius:50%}
.act{border:2px solid #FFD700;background:#111;color:#FFD700;padding:10px;border-radius:10px;font-weight:bold;flex:1}
.green{background:#00d26a;color:#fff;border:none;padding:16px;border-radius:12px;width:100%;font-weight:bold;font-size:16px;margin-top:10px}
.share{display:flex;gap:8px;margin-top:10px}.share button{flex:1;padding:14px;border-radius:12px;font-weight:bold;border:none}
</style>
</head>
<body>
<div class="top"><a href="index.html" class="active">🎵 MÚSICAS</a><a href="video.html">🎬 VÍDEOS</a></div>
<div class="card">
<audio id="audio" controls></audio>
<div id="nome">Carregando...</div><div id="cont" style="color:#aaa">0 músicas</div>
<div class="btns"><button class="peq" onclick="aleat()">🔀</button><button onclick="ant()">⏮</button><button style="width:80px;height:80px;font-size:30px" onclick="pp()">▶️</button><button onclick="prox()">⏭</button><button class="peq" onclick="rep()">🔁</button></div>
<div class="lista" id="lista"></div>
<div style="display:flex;gap:8px;margin-top:10px"><button class="act" onclick="backup()">💾 Backup</button><button class="act" onclick="document.getElementById('rest').click()">♻️ Restaurar</button><button class="act" onclick="resetar()">🗑️ Resetar</button></div>
<input type="file" id="rest" style="display:none">
</div>
<button class="green" onclick="document.getElementById('file').click()">➕ Adicionar Músicas do Celular</button>
<input type="file" id="file" multiple accept="audio/*" style="display:none">
<button class="green" style="background:#111;border:2px solid #FFD700;color:#FFD700" onclick="addLink()">🔗 Adicionar por Link (YouTube/MP3)</button>
<div class="share">
<button style="background:#25D366;color:#fff" onclick="compartilhar()">📲 Compartilhar</button>
<button style="background:#FFD700;color:#000" onclick="convidar()">👥 Convidar</button>
</div>
<p style="margin:20px"><a href="privacidade.html" style="color:#FFD700">Privacidade</a> | <a href="termos.html" style="color:#FFD700">Termos</a> | <a href="contato.html" style="color:#FFD700">Contato</a></p>
<div id="cookie" style="position:fixed;bottom:0;left:0;right:0;background:#222;border-top:2px solid #FFD700;padding:15px;display:none"><p>🍪 Usamos cookies para AdSense. Veja nossa <a href="privacidade.html" style="color:#FFD700">Política de Privacidade</a>.</p><button onclick="localStorage.setItem('cookies','sim');document.getElementById('cookie').style.display='none'" style="background:#FFD700;border:none;padding:10px 20px;border-radius:8px;font-weight:bold;margin-top:8px">Aceitar e Continuar</button></div>
<script>
let musicas=[], idx=0, ale=false, repe=false;
const audio=document.getElementById('audio'), nome=document.getElementById('nome'), lista=document.getElementById('lista'), cont=document.getElementById('cont');
let db; const req=indexedDB.open('V86DB',2);
req.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains('musicas')) e.target.result.createObjectStore('musicas',{keyPath:'id',autoIncrement:true});};
req.onsuccess=async e=>{db=e.target.result; if(!localStorage.getItem('cookies')) document.getElementById('cookie').style.display='block'; await carregarGlobal(); carregarLocal();};

async function carregarGlobal(){
 try{ const r=await fetch('./musicas/lista.json?v='+Date.now()); if(r.ok){ const j=await r.json(); j.forEach(m=>{musicas.push({id:'g_'+m.arquivo, nome:m.titulo, url:'./musicas/'+m.arquivo, global:true});}); } }catch(e){}
}
function carregarLocal(){ db.transaction('musicas','readonly').objectStore('musicas').getAll().onsuccess=e=>{ e.target.result.forEach(r=>{musicas.push({id:r.id, nome:r.nome, url:URL.createObjectURL(r.blob), global:false, blobId:r.id});}); montar(); };}
function montar(){ cont.innerText=musicas.length+' músicas'; if(!musicas.length){nome.innerText='Nenhuma música - adicione'; lista.innerHTML=''; return;} render(); if(!audio.src) carregar(0);}
function render(){ lista.innerHTML=''; musicas.forEach((m,i)=>{ const d=document.createElement('div'); d.className='item'+(i==idx?' active':''); const s=document.createElement('span'); s.innerText=(i+1)+'. '+m.nome+(m.global?' 🌎':''); s.onclick=()=>{carregar(i); audio.play();}; const b=document.createElement('button'); b.className='del'; b.innerText='🗑️'; b.onclick=()=>{ if(m.global){alert('Música global - só pode apagar pelo GitHub na pasta musicas'); return;} if(confirm('Apagar?')){ const tx=db.transaction('musicas','readwrite'); tx.objectStore('musicas').delete(m.blobId); tx.oncomplete=()=>location.reload(); } }; d.appendChild(s); d.appendChild(b); lista.appendChild(d); });}
function carregar(i){ idx=i; audio.src=musicas[i].url; nome.innerText=musicas[i].nome; render();}
function pp(){ audio.paused?audio.play():audio.pause(); } function prox(){ if(!musicas.length) return; let n=ale?Math.floor(Math.random()*musicas.length):(idx+1)%musicas.length; carregar(n); audio.play(); } function ant(){ if(!musicas.length) return; carregar((idx-1+musicas.length)%musicas.length); audio.play(); }
function aleat(){ ale=!ale; alert(ale?'Aleatório ON':'Aleatório OFF'); } function rep(){ repe=!repe; audio.loop=repe; alert(repe?'Repetir ON':'Repetir OFF'); }
function resetar(){ if(confirm('Apagar só suas músicas locais? As globais continuam.')){ const tx=db.transaction('musicas','readwrite'); tx.objectStore('musicas').clear(); tx.oncomplete=()=>location.reload(); }}
function backup(){ alert('Backup é automático - suas músicas ficam salvas no celular mesmo fechando o app'); }
function addLink(){ const link=prompt('Cole o link direto do MP3 (ex: https://.../musica.mp3)'); if(link){ const titulo=prompt('Nome da música:')||'Música por link'; musicas.push({id:Date.now(), nome:titulo, url:link, global:false}); montar(); carregar(musicas.length-1); audio.play(); }}
function compartilhar(){ const l=location.href; if(navigator.share){navigator.share({title:'V86 PLAY',url:l});} else {navigator.clipboard.writeText(l); alert('Link copiado: '+l);} }
function convidar(){ const msg='🎧 Ouve minha playlist no V86 PLAY 👉 '+location.href; window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank'); }
audio.onended=()=>{ if(!repe) prox(); }
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
