<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V86 PLAY LIST</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFD700">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff;text-align:center;padding:10px;padding-bottom:80px}
.top{display:flex;gap:8px;margin-bottom:12px}
.top a{flex:1;text-decoration:none;padding:12px;border-radius:10px;font-weight:bold;background:#222;color:#FFD700;border:2px solid #FFD700;text-align:center}
.top a.active{background:#FFD700;color:#000}
.player{border:2px solid #FFD700;border-radius:20px;padding:12px;background:#111;margin-bottom:15px}
audio{width:100%;margin:10px 0}
#nome{color:#FFD700;font-size:18px;font-weight:bold;margin:8px 0;min-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btns{display:flex;justify-content:center;gap:10px;margin:10px 0;align-items:center}
.btns button{background:#FFD700;border:none;width:65px;height:65px;border-radius:50%;font-size:22px;cursor:pointer}
.btns button.small{width:50px;height:50px;background:#222;border:2px solid #555}
.lista{text-align:left;background:#1a1a1a;border-radius:10px;padding:5px;max-height:300px;overflow:auto;margin:10px 0}
.item{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #333}
.item.active{color:#FFD700;background:#222;border-radius:8px}
.item span{flex:1;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.del{background:#ff2a2a;color:#fff;border:none;width:35px;height:35px;border-radius:50%;font-size:16px;cursor:pointer;margin-left:8px}
.green{background:#00d26a;color:#fff;border:none;padding:15px;border-radius:12px;width:100%;font-weight:bold;font-size:16px;margin:8px 0;cursor:pointer}
.yellow-box{background:#FFD700;color:#000;border-radius:15px;padding:15px;margin:15px 0}
.yellow-box button{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:none;font-weight:bold;font-size:15px;cursor:pointer}
.black{background:#000;color:#FFD700}
.tools{display:flex;gap:8px;margin:10px 0}
.tools button{flex:1;padding:10px;border-radius:10px;border:2px solid #FFD700;background:#111;color:#FFD700;font-weight:bold;font-size:12px}
.install-big{background:#FFD700;color:#000;border:none;padding:18px;border-radius:15px;width:100%;font-weight:bold;font-size:18px;margin:12px 0;cursor:pointer;animation:pulse 2s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
</style>
</head>
<body>

<div class="top">
<a href="index.html" class="active">🎵 MÚSICAS</a>
<a href="video.html">🎬 VÍDEOS</a>
</div>

<div class="player">
<audio id="audio" controls></audio>
<div id="nome">Carregando músicas...</div>
<div id="contador" style="color:#aaa">0 músicas</div>
<div class="btns">
<button class="small" onclick="tocarAleatorio()">🔀</button>
<button onclick="anterior()">⏮</button>
<button style="width:80px;height:80px;font-size:30px" onclick="playPause()">▶️</button>
<button onclick="proxima()">⏭</button>
<button class="small" onclick="toggleLoop()">🔁</button>
</div>
<div class="lista" id="lista"></div>
<div class="tools">
<button onclick="fazerBackup()">💾 Backup</button>
<button onclick="document.getElementById('restoreInput').click()">♻️ Restaurar</button>
<button onclick="resetar()">🗑️ Resetar</button>
</div>
</div>

<button class="green" onclick="document.getElementById('fileInput').click()">➕ Adicionar Músicas e Vídeos do Celular</button>
<input type="file" id="fileInput" multiple accept="audio/*,video/*" style="display:none">
<input type="file" id="restoreInput" accept=".json" style="display:none">

<div class="yellow-box">
<h2>Gostou do V86 PLAY? 🔥</h2>
<p>Compartilhe com a família!</p>
<button class="black" onclick="tocarAleatorio()">🔀 Tocar Aleatoriamente</button>
<button class="green" onclick="compartilharZap()">💚 Compartilhar no WhatsApp</button>
<button class="black" onclick="convidar()">👥 Convidar Amigo / Esposa</button>
<p style="margin-top:10px"><a href="privacidade.html" style="color:#000">🔒 Privacidade</a> | <a href="termos.html" style="color:#000">Termos</a> | <a href="contato.html" style="color:#000">Contato</a> | <a href="video.html" style="color:#000">🎬 Vídeos</a></p>
</div>

<button class="install-big" onclick="instalar()">📲 INSTALAR APP NO CELULAR</button>

<!-- Banner LGPD/AdSense - OBRIGATÓRIO PRO ADSENSE -->
<div id="cookieBanner" style="position:fixed;bottom:0;left:0;right:0;background:#222;color:#fff;padding:15px;text-align:center;z-index:9999;display:none;border-top:3px solid #FFD700">
<p style="margin:5px;font-size:14px">🍪 Usamos cookies para personalizar anúncios (Google AdSense) e melhorar sua experiência. Ao continuar, você concorda com nossa <a href="privacidade.html" style="color:#FFD700">Política de Privacidade</a>.</p>
<button onclick="aceitarCookies()" style="background:#FFD700;color:#000;border:none;padding:10px 20px;border-radius:8px;font-weight:bold;margin-top:8px;cursor:pointer">Aceitar e Continuar</button>
</div>

<script>
let musicasGitHub=[], musicasLocal=[], musicas=[], indice=0;
const audio=document.getElementById('audio'), nomeEl=document.getElementById('nome'), listaEl=document.getElementById('lista'), contadorEl=document.getElementById('contador');
let db, deferredPrompt=null;
const request=indexedDB.open('V86DB',1);
request.onupgradeneeded=e=>e.target.result.createObjectStore('musicas',{keyPath:'id',autoIncrement:true});
request.onsuccess=e=>{db=e.target.result; carregarLocalDB(); carregarListaGitHub();};
request.onerror=()=>carregarListaGitHub();
function carregarLocalDB(){ if(!db) return; db.transaction('musicas','readonly').objectStore('musicas').getAll().onsuccess=e=>{ musicasLocal=e.target.result.map(r=>({id:r.id,nome:r.nome,url:URL.createObjectURL(r.blob),tipo:'local'})); montar(); };}
async function carregarListaGitHub(){ try{ const res=await fetch('./musicas/lista.json?v='+Date.now()); const lista=await res.json(); musicasGitHub=lista.map(m=>({nome:m.nome,url:'./musicas/'+m.arquivo,tipo:'github'})); }catch(e){musicasGitHub=[];} montar();}
function montar(){musicas=[...musicasGitHub,...musicasLocal]; if(musicas.length>0){renderizar(); if(!audio.src) carregar(0);} else{nomeEl.innerText="Nenhuma música"; contadorEl.innerText="0 músicas";}}
function renderizar(){ listaEl.innerHTML=""; contadorEl.innerText=musicas.length+" músicas/vídeos"; musicas.forEach((m,i)=>{ const div=document.createElement('div'); div.className='item'+(i===indice?' active':''); const span=document.createElement('span'); span.innerText=(i+1)+'. '+m.nome; span.onclick=()=>{carregar(i); audio.play();}; const btn=document.createElement('button'); btn.className='del'; btn.innerText='🗑️'; btn.onclick=e=>{e.stopPropagation(); apagar(i);}; div.appendChild(span); div.appendChild(btn); listaEl.appendChild(div); });}
function carregar(i){indice=i; audio.src=musicas[i].url; nomeEl.innerText=musicas[i].nome; renderizar();}
function playPause(){audio.paused?audio.play():audio.pause();}
function proxima(){if(musicas.length){carregar((indice+1)%musicas.length); audio.play();}}
function anterior(){if(musicas.length){carregar((indice-1+musicas.length)%musicas.length); audio.play();}}
function tocarAleatorio(){if(musicas.length){carregar(Math.floor(Math.random()*musicas.length)); audio.play();}}
function toggleLoop(){audio.loop=!audio.loop; alert(audio.loop?"Repetir: LIGADO":"Repetir: DESLIGADO");}
audio.onended=()=>proxima();
function apagar(i){ const m=musicas[i]; if(!confirm(`Apagar "${m.nome}"?`)) return; if(m.tipo==='github'){musicasGitHub.splice(musicasGitHub.findIndex(x=>x.url===m.url),1); montar();} else{const tx=db.transaction('musicas','readwrite'); tx.objectStore('musicas').delete(m.id); tx.oncomplete=()=>carregarLocalDB();}}
document.getElementById('fileInput').addEventListener('change', async e=>{ const files=Array.from(e.target.files); for(const f of files){await new Promise(r=>{const tx=db.transaction('musicas','readwrite'); tx.objectStore('musicas').add({nome:f.name,blob:f}); tx.oncomplete=r;});} carregarLocalDB();});
function fazerBackup(){ if(musicasLocal.length===0){alert('Só tem músicas do GitHub. Adicione pelo celular primeiro.'); return;} const blob=new Blob([JSON.stringify({data:new Date().toISOString(),qtd:musicasLocal.length,lista:musicasLocal.map(m=>({nome:m.nome}))},null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='backup-v86-musica-'+Date.now()+'.json'; a.click();}
document.getElementById('restoreInput').addEventListener('change', e=>{ const file=e.target.files[0]; if(!file) return; const rd=new FileReader(); rd.onload=ev=>{ try{const d=JSON.parse(ev.target.result); alert(`Backup de ${d.qtd} músicas - Já salvo no celular!`);} catch{alert('Arquivo inválido');} }; rd.readAsText(file);});
function resetar(){ if(confirm('Resetar? Apaga só o que você adicionou do celular.')){ if(db){const tx=db.transaction('musicas','readwrite'); tx.objectStore('musicas').clear(); tx.oncomplete=()=>{musicasLocal=[]; montar(); carregarListaGitHub();};}}}
function compartilharZap(){ const url=window.location.href; window.open(`https://wa.me/?text=🎵 V86 PLAY LIST 🔥 Escuta comigo: ${url}`, '_blank');}
function convidar(){ const url=window.location.href; window.open(`https://wa.me/?text=👋 Te convidei pro meu app V86 PLAY! Instala aqui: ${url}`, '_blank');}
function aceitarCookies(){localStorage.setItem('cookiesAceitos','sim'); document.getElementById('cookieBanner').style.display='none';}
if(!localStorage.getItem('cookiesAceitos')){document.getElementById('cookieBanner').style.display='block';}
window.addEventListener('beforeinstallprompt', e=>{e.preventDefault(); deferredPrompt=e; document.querySelector('.install-big').innerText='📲 INSTALAR APP AGORA!';});
function instalar(){ if(deferredPrompt){deferredPrompt.prompt();} else{alert('No Chrome: 3 pontinhos ⋮ > Instalar app ou Adicionar à tela inicial');}}
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
</script>
</body>
</html>
