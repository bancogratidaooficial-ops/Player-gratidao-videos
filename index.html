<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V86 PLAY - Músicas</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFD700">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#000;color:#fff;text-align:center;padding:10px;padding-bottom:90px}
.top{display:flex;gap:8px;margin-bottom:12px}.top a{flex:1;text-decoration:none;padding:12px;border-radius:10px;font-weight:bold;background:#222;color:#FFD700;border:2px solid #FFD700}.top a.active{background:#FFD700;color:#000}
.player{border:2px solid #FFD700;border-radius:20px;padding:15px;background:#111;margin-bottom:15px}
audio{width:100%;margin:10px 0} #nome{color:#FFD700;font-size:18px;font-weight:bold;margin:8px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btns{display:flex;justify-content:center;gap:10px;margin:15px 0;flex-wrap:wrap}.btns button{background:#FFD700;border:none;width:60px;height:60px;border-radius:50%;font-size:20px;cursor:pointer}.btns button.peq{width:45px;height:45px;background:#222;border:2px solid #FFD700;font-size:16px}
.lista{text-align:left;background:#1a1a1a;border-radius:10px;padding:5px;max-height:300px;overflow:auto;margin:10px 0}
.item{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #333}.item.active{color:#FFD700;background:#222;border-radius:8px}.item span{flex:1;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.del{background:#ff2a2a;color:#fff;border:none;width:35px;height:35px;border-radius:50%}
.green{background:#00d26a;color:#fff;border:none;padding:15px;border-radius:12px;width:100%;font-weight:bold;font-size:16px;margin:8px 0;cursor:pointer}
.opcoes{display:flex;gap:8px;margin:10px 0}.opcoes button{flex:1;background:#111;border:2px solid #FFD700;color:#FFD700;padding:10px;border-radius:10px;font-weight:bold}
</style>
</head>
<body>
<div class="top"><a href="index.html" class="active">🎵 MÚSICAS</a><a href="video.html">🎬 VÍDEOS</a></div>

<div class="player">
<audio id="audio" controls></audio>
<div id="nome">Nenhuma música</div>
<div id="contador" style="color:#aaa">0 músicas</div>

<div class="btns">
<button class="peq" onclick="aleatorio()">🔀</button>
<button onclick="anterior()">⏮</button>
<button style="width:80px;height:80px;font-size:30px" onclick="playPause()">▶️</button>
<button onclick="proxima()">⏭</button>
<button class="peq" onclick="repetir()">🔁</button>
</div>

<div class="lista" id="lista"></div>

<div class="opcoes">
<button onclick="backup()">💾 Backup</button>
<button onclick="document.getElementById('rest').click()">♻️ Restaurar</button>
<button onclick="resetar()">🗑️ Resetar</button>
</div>
<input type="file" id="rest" style="display:none" accept=".json">
</div>

<button class="green" onclick="document.getElementById('file').click()">➕ Adicionar Músicas do Celular</button>
<input type="file" id="file" multiple accept="audio/*" style="display:none">

<div style="margin:20px"><a href="privacidade.html" style="color:#FFD700">🔒 Privacidade</a> | <a href="termos.html" style="color:#FFD700">Termos</a> | <a href="contato.html" style="color:#FFD700">Contato</a></div>

<div id="cookies" style="position:fixed;bottom:0;left:0;right:0;background:#222;border-top:2px solid #FFD700;padding:15px;display:none"><p>🍪 Usamos cookies para anúncios (AdSense). Ao continuar, você concorda com nossa <a href="privacidade.html" style="color:#FFD700">Política de Privacidade</a>.</p><button onclick="aceitar()" style="background:#FFD700;border:none;padding:10px 20px;border-radius:8px;font-weight:bold;margin-top:10px">Aceitar e Continuar</button></div>

<script>
let musicas=[], indice=0, modoAleatorio=false, modoRepetir=false;
const audio=document.getElementById('audio'), nomeEl=document.getElementById('nome'), listaEl=document.getElementById('lista'), contadorEl=document.getElementById('contador');
let db; const req=indexedDB.open('V86DB',2);
req.onupgradeneeded=e=>{const db=e.target.result; if(!db.objectStoreNames.contains('musicas')) db.createObjectStore('musicas',{keyPath:'id',autoIncrement:true});};
req.onsuccess=e=>{db=e.target.result; carregarDB(); checarCookie();};
function checarCookie(){if(!localStorage.getItem('cookies')) document.getElementById('cookies').style.display='block';}
function aceitar(){localStorage.setItem('cookies','sim'); document.getElementById('cookies').style.display='none';}
function carregarDB(){db.transaction('musicas','readonly').objectStore('musicas').getAll().onsuccess=e=>{musicas=e.target.result.map(r=>({id:r.id,nome:r.nome,url:URL.createObjectURL(r.blob)})); montar();};}
function montar(){contadorEl.innerText=musicas.length+' músicas'; if(musicas.length==0){nomeEl.innerText='Nenhuma música - adicione'; listaEl.innerHTML=''; return;} render(); if(!audio.src) carregar(0);}
function render(){listaEl.innerHTML=''; musicas.forEach((m,i)=>{const div=document.createElement('div'); div.className='item'+(i===indice?' active':''); const span=document.createElement('span'); span.innerText=(i+1)+'. '+m.nome; span.onclick=()=>{carregar(i); audio.play();}; const btn=document.createElement('button'); btn.className='del'; btn.innerText='🗑️'; btn.onclick=()=>{if(confirm('Apagar?')){const tx=db.transaction('musicas','readwrite'); tx.objectStore('musicas').delete(m.id); tx.oncomplete=()=>carregarDB();}}; div.appendChild(span); div.appendChild(btn); listaEl.appendChild(div);});}
function carregar(i){indice=i; audio.src=musicas[i].url; nomeEl.innerText=musicas[i].nome; render();}
function playPause(){audio.paused?audio.play():audio.pause();}
function proxima(){if(!musicas.length) return; let p=modoAleatorio?Math.floor(Math.random()*musicas.length):(indice+1)%musicas.length; carregar(p); audio.play();}
function anterior(){if(!musicas.length) return; carregar((indice-1+musicas.length)%musicas.length); audio.play();}
function aleatorio(){modoAleatorio=!modoAleatorio; alert(modoAleatorio?'Modo aleatório ligado':'Modo aleatório desligado');}
function repetir(){modoRepetir=!modoRepetir; alert(modoRepetir?'Repetir ligado':'Repetir desligado');}
audio.onended=()=>{if(modoRepetir){audio.play();}else{proxima();}}
function resetar(){if(confirm('Apagar todas as músicas?')){const tx=db.transaction('musicas','readwrite'); tx.objectStore('musicas').clear(); tx.oncomplete=()=>carregarDB();}}
function backup(){const a=document.createElement('a'); a.href='data:text/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(musicas.map(m=>m.nome))); a.download='backup-v86.json'; a.click();}
document.getElementById('file').addEventListener('change', async e=>{for(const f of e.target.files){await new Promise(r=>{const tx=db.transaction('musicas','readwrite'); tx.objectStore('musicas').add({nome:f.name,blob:f}); tx.oncomplete=r;});} carregarDB();});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script>
</body>
</html>
